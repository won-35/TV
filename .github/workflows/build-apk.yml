name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [preset-config]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept SDK licenses & install platform 37
        run: |
          SDKMANAGER=$(find /usr/local/lib/android /opt/android "${ANDROID_HOME}" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          echo "--- available platforms ---"
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-[0-9]+ " | tail -8
          echo "--- install 37 ---"
          "$SDKMANAGER" --channel=3 "platforms;android-37" "platform-tools" 2>&1 | tail -30
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: fongmi-preset-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
